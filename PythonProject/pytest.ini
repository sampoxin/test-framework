[pytest]
addopts = -s --tb=short --slowmo=1000 --reruns 2 --reruns-delay 1 --cov=api --cov=utils --cov-report=term --cov-report=html --alluredir=reports/allure-results
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: 冒烟测试用例
    skip_login: 跳过小程序自动登录（登录测试用例专用）
    web: 后台管理系统UI测试
    flaky: 不稳定用例（自动重试）